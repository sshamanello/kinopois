services:
  kinopois-prepare:
    build: .
    env_file: .env
    restart: "no"
    volumes:
      # Persistent data — survives container restarts
      - ./data:/app/data
      # Persistent logs
      - ./logs:/app/logs
      - ./credentials:/app/credentials:ro
      # SSH key pair for remote publish sync (87.120.219.4)
      - /home/nick/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /home/nick/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Default: full base pipeline with local queue sync.
    # Manual/cron usage:
    # docker compose run --rm kinopois-prepare
    command: run-base-pipeline --limit 200

  kinopois-autopilot:
    build: .
    env_file: .env
    restart: always
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./credentials:/app/credentials:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: autopilot
